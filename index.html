<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Y STUDIO</title>
<meta name="description" content="思いつきを、かたちに。つくったプロダクトを静かに並べておく場所。">
<meta property="og:title" content="Y STUDIO">
<meta property="og:description" content="思いつきを、かたちに。つくったプロダクトを静かに並べておく場所。">
<meta property="og:type" content="website">
<link rel="icon" href="icons/y-studio.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<header class="site-header">
  <a class="logo" href="#top">Y STUDIO<span class="logo-dot">.</span></a>
  <nav class="site-nav">
    <a href="#products">Products</a>
  </nav>
</header>

<main id="top">

  <section class="hero">
    <div class="hero-copy">
      <p class="hero-eyebrow">Personal Product Shelf</p>
      <h1 class="hero-title">思いつきを、<br><span class="hl">かたちに。</span></h1>
      <p class="hero-lead">ここは、自分がつくったプロダクトを静かに並べておく場所。<br>眺めて、思い出して、また次をつくるための棚。</p>
      <div class="hero-actions">
        <a class="btn btn-primary" href="#products">作品を見る ↓</a>
        <a class="btn btn-ghost" href="https://x.com/dedonfq" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
          アカウント
        </a>
      </div>
    </div>
    <figure class="hero-figure">
      <span class="shape shape-tri" aria-hidden="true"></span>
      <span class="shape shape-tri2" aria-hidden="true"></span>
      <span class="shape shape-square" aria-hidden="true"></span>
      <span class="shape shape-circle" aria-hidden="true"></span>
      <span class="shape shape-dot" aria-hidden="true"></span>
      <img src="assets/img/hero-character.png" alt="" width="500" height="500">
    </figure>
  </section>

  <section class="products" id="products">
    <div class="section-head">
      <h2>Products</h2>
      <span class="count" id="product-count"></span>
    </div>
    <div class="grid" id="product-grid"></div>
  </section>

</main>

<footer class="site-footer">
  <p>© 2026 Y STUDIO</p>
</footer>

<div class="modal" id="modal" hidden>
  <div class="modal-overlay" data-close></div>
  <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="modal-name">
    <button class="modal-close" data-close aria-label="閉じる">&times;</button>
    <img class="modal-icon" id="modal-icon" alt="" width="96" height="96">
    <h2 class="modal-name" id="modal-name"></h2>
    <p class="modal-tagline" id="modal-tagline"></p>
    <p class="modal-desc" id="modal-desc"></p>
    <div class="modal-meta">
      <span class="modal-date" id="modal-date"></span>
      <span class="modal-tags" id="modal-tags"></span>
    </div>
    <a class="modal-link" id="modal-link" target="_blank" rel="noopener">サイトを見る ↗</a>
  </div>
</div>

<script src="assets/app.js"></script>
</body>
</html>
